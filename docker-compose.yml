name: elewen

services:
  postgres:
    image: postgres:16-alpine
    container_name: elewen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: elewen_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: elewen_migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=api
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ["node_modules/.bin/prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]

  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
      target: production
    container_name: elewen_strapi
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      PUBLIC_URL: ${PUBLIC_STRAPI_URL:-https://strapi.elewen.co.in}
      FRONTEND_URL: ${PUBLIC_SITE_URL:-https://elewen.co.in}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_REGION: ${R2_REGION:-auto}
      R2_FORCE_PATH_STYLE: ${R2_FORCE_PATH_STYLE:-true}
    ports:
      - "1337:1337"
    volumes:
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: elewen_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=api
      STRAPI_URL: http://strapi:1337
      STRAPI_JWT_SECRET: ${STRAPI_JWT_SECRET}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_URL: ${PUBLIC_SITE_URL:-https://elewen.co.in}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      strapi:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-https://api.elewen.co.in}
        VITE_STRAPI_URL: ${PUBLIC_STRAPI_URL:-https://strapi.elewen.co.in}
        VITE_USE_FALLBACK: ${VITE_USE_FALLBACK:-false}
    container_name: elewen_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
      - strapi

  admin-panel:
    build:
      context: ./admin-pannel
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-https://api.elewen.co.in}
        VITE_ADMIN_NO_AUTH: ${VITE_ADMIN_NO_AUTH:-false}
    container_name: elewen_admin_panel
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: elewen_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - admin-panel
      - api
      - strapi

  certbot:
    image: certbot/certbot:latest
    container_name: elewen_certbot
    profiles:
      - manual
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot

  certbot-renew:
    image: certbot/certbot:latest
    container_name: elewen_certbot_renew
    restart: unless-stopped
    env_file: .env
    environment:
      CERTBOT_DRY_RUN: ${CERTBOT_DRY_RUN:-0}
      CERTBOT_RENEW_INTERVAL: ${CERTBOT_RENEW_INTERVAL:-43200}
    pid: service:nginx
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
      - ./scripts/ssl/renew-entrypoint.sh:/renew-entrypoint.sh:ro
    entrypoint: /bin/sh
    command: /renew-entrypoint.sh
    depends_on:
      - nginx

volumes:
  postgres_data:
  strapi_uploads:
  certbot_conf:
  certbot_www:
