services:
  postgres:
    image: postgres:16-alpine
    container_name: elewen_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    container_name: elewen_strapi
    restart: always
    env_file: .env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 1337
    ports:
      - "1337:1337"
    volumes:
      - ./strapi/src:/app/src
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: elewen_migrate
    env_file: .env
    volumes:
      - ./api/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node_modules/.bin/prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: elewen_api
    restart: always
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=api
      JWT_SECRET: ${JWT_SECRET}
      STRAPI_URL: http://strapi:1337
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elewen_frontend
    restart: always
    env_file: .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_STRAPI_URL: ${VITE_STRAPI_URL:-http://localhost:1337}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
      - strapi

  nginx:
    image: nginx:alpine
    container_name: elewen_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - strapi
      - api
      - frontend

volumes:
  postgres_data:
  strapi_uploads:
