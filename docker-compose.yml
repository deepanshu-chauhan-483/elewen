services:
  redis:
    image: redis:7-alpine
    container_name: elewen_redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: elewen_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
    container_name: elewen_strapi
    restart: always
    env_file: .env
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 1337
      CLOUDINARY_NAME: ${CLOUDINARY_NAME}
      CLOUDINARY_KEY: ${CLOUDINARY_KEY}
      CLOUDINARY_SECRET: ${CLOUDINARY_SECRET}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM:-noreply@elewen.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      - "1337:1337"
    volumes:
      - ./strapi/src:/app/src
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: elewen_migrate
    env_file: .env
    environment:
      # Inside Docker, Postgres is reachable via the service name `postgres` (not 127.0.0.1).
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=api
    volumes:
      - ./api/prisma:/app/prisma
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node_modules/.bin/prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]
    restart: "no"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: elewen_api
    restart: always
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=api
      JWT_SECRET: ${JWT_SECRET}
      STRAPI_URL: http://strapi:1337
      STRAPI_JWT_SECRET: ${STRAPI_JWT_SECRET}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./api/src:/app/src
      - ./api/test-payment.html:/app/test-payment.html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elewen_frontend
    restart: always
    env_file: .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_STRAPI_URL: ${VITE_STRAPI_URL:-http://localhost:1337}
      VITE_USE_FALLBACK: ${VITE_USE_FALLBACK:-false}
      VITE_CLOUDINARY_NAME: ${VITE_CLOUDINARY_NAME}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - api
      - strapi

  admin-panel:
    build:
      context: ./admin-pannel
      dockerfile: Dockerfile
    container_name: elewen_admin_panel
    restart: always
    env_file: .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5174:5174"
    volumes:
      - ./admin-pannel/src:/app/src
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: elewen_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - strapi
      - api
      - frontend

volumes:
  postgres_data:
  strapi_uploads:
