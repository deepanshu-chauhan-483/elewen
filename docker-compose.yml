name: elewen

services:
  postgres:
    image: postgres:16-alpine
    container_name: elewen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/sync-password.sh:/usr/local/bin/sync-password.sh:ro
    entrypoint: ["sh", "/usr/local/bin/sync-password.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: elewen_redis
    restart: unless-stopped
    # Bind to loopback only — API uses redis://redis:6379 on the Docker network.
    # Avoids exposing Redis on the droplet's public IP (DO security notice).
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: elewen_migrate
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=api
    depends_on:
      postgres:
        condition: service_healthy
    command:
      ["node_modules/.bin/prisma", "migrate", "deploy", "--schema=prisma/schema.prisma"]

  strapi:
    build:
      context: ./strapi
      dockerfile: Dockerfile
      target: production
    container_name: elewen_strapi
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DB_NAME}
      DATABASE_USERNAME: ${DB_USER}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ADMIN_JWT_SECRET: ${STRAPI_ADMIN_JWT_SECRET}
      APP_KEYS: ${STRAPI_APP_KEYS}
      API_TOKEN_SALT: ${STRAPI_API_TOKEN_SALT}
      TRANSFER_TOKEN_SALT: ${STRAPI_TRANSFER_TOKEN_SALT}
      PUBLIC_URL: ${PUBLIC_STRAPI_URL:-https://strapi.elewen.co.in}
      FRONTEND_URL: ${PUBLIC_SITE_URL:-https://elewen.co.in}
      STRAPI_ADMIN_RATELIMIT_ENABLED: ${STRAPI_ADMIN_RATELIMIT_ENABLED:-true}
      STRAPI_ADMIN_RATELIMIT_INTERVAL_MIN: ${STRAPI_ADMIN_RATELIMIT_INTERVAL_MIN:-5}
      STRAPI_ADMIN_RATELIMIT_MAX: ${STRAPI_ADMIN_RATELIMIT_MAX:-50}
      STRAPI_EMAIL_CONFIRMATION: ${STRAPI_EMAIL_CONFIRMATION:-true}
      CORS_ORIGIN: ${CORS_ORIGIN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PROVIDER: ${SMTP_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Elewen}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_REGION: ${R2_REGION:-auto}
      R2_FORCE_PATH_STYLE: ${R2_FORCE_PATH_STYLE:-true}
      SEED_COUPON_TEMPLATES: ${SEED_COUPON_TEMPLATES:-false}
    ports:
      - "1337:1337"
    volumes:
      - strapi_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:1337', (r) => process.exit(r.statusCode && r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: production
    container_name: elewen_api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=api
      STRAPI_URL: http://strapi:1337
      STRAPI_JWT_SECRET: ${STRAPI_JWT_SECRET}
      STRAPI_API_TOKEN: ${STRAPI_API_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: ${CORS_ORIGIN}
      APP_URL: ${PUBLIC_SITE_URL:-https://elewen.co.in}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://elewen.co.in}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://api.elewen.co.in}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_PROVIDER: ${SMTP_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Elewen}
      SMTP_REPLY_TO: ${SMTP_REPLY_TO:-}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      strapi:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-https://api.elewen.co.in}
        VITE_STRAPI_URL: ${PUBLIC_STRAPI_URL:-https://strapi.elewen.co.in}
        VITE_USE_FALLBACK: ${VITE_USE_FALLBACK:-false}
    container_name: elewen_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
      strapi:
        condition: service_healthy

  admin-panel:
    build:
      context: ./admin-pannel
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-https://api.elewen.co.in}
        VITE_ADMIN_NO_AUTH: ${VITE_ADMIN_NO_AUTH:-false}
    container_name: elewen_admin_panel
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  strapi_uploads:
