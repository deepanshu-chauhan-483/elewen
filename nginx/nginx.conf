worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 100m;

  # Let's Encrypt (mounted from certbot volume)
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  # ─── Compression (JS/CSS bundles + JSON from Strapi/API) ──────
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  # ─── Cache for public Strapi CMS reads (landing/about/packages/etc.) ──
  # Authenticated requests (Authorization header) and auth/upload/account
  # routes always bypass the cache.
  proxy_cache_path /var/cache/nginx/strapi levels=1:2 keys_zone=strapi_cache:10m max_size=200m inactive=10m use_temp_path=off;

  map $request_uri $strapi_no_cache {
    default 0;
    "~^/api/(auth|connect|users|upload|permissions|roles)" 1;
  }

  upstream frontend_upstream {
    server frontend:80;
  }

  upstream api_upstream {
    server api:3000;
  }

  upstream admin_upstream {
    server admin-panel:80;
  }

  upstream strapi_upstream {
    server strapi:1337;
  }

  # ─── HTTP: ACME challenge + redirect to HTTPS ─────────────────
  server {
    listen 80;
    server_name elewen.co.in www.elewen.co.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 80;
    server_name api.elewen.co.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 80;
    server_name admin.elewen.co.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 80;
    server_name strapi.elewen.co.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ─── HTTPS: Website ───────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name elewen.co.in www.elewen.co.in;

    ssl_certificate /etc/letsencrypt/live/elewen.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elewen.co.in/privkey.pem;

    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # ─── HTTPS: API ───────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name api.elewen.co.in;

    ssl_certificate /etc/letsencrypt/live/elewen.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elewen.co.in/privkey.pem;

    location / {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_connect_timeout 30s;
      proxy_send_timeout 120s;
      proxy_read_timeout 120s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # ─── HTTPS: Admin panel ───────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name admin.elewen.co.in;

    ssl_certificate /etc/letsencrypt/live/elewen.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elewen.co.in/privkey.pem;

    location / {
      proxy_pass http://admin_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }

  # ─── HTTPS: Strapi CMS ────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name strapi.elewen.co.in;

    ssl_certificate /etc/letsencrypt/live/elewen.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elewen.co.in/privkey.pem;

    # Public CMS content (landing/about/packages/etc.) — cached briefly so
    # repeat requests across visitors don't all hit Strapi/Postgres.
    location /api/ {
      proxy_pass http://strapi_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      proxy_cache strapi_cache;
      proxy_cache_methods GET HEAD;
      proxy_cache_valid 200 30s;
      proxy_cache_key "$scheme$request_method$host$request_uri";
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
      proxy_cache_background_update on;
      proxy_cache_lock on;
      proxy_no_cache $strapi_no_cache $http_authorization;
      proxy_cache_bypass $strapi_no_cache $http_authorization;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
      proxy_pass http://strapi_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}
