name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  packages: read

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event.inputs.environment == 'staging')

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "TODO: Add SSH/SCP or kubectl deploy commands for staging"
          echo "Images: ghcr.io/${GITHUB_REPOSITORY,,}/api:main"
          echo "        ghcr.io/${GITHUB_REPOSITORY,,}/strapi:main"
          echo "        ghcr.io/${GITHUB_REPOSITORY,,}/frontend:main"
          echo "        ghcr.io/${GITHUB_REPOSITORY,,}/admin-pannel:main"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    needs: deploy-staging

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: |
          echo "TODO: Add SSH/SCP or kubectl deploy commands for production"
          echo "Images: ghcr.io/${GITHUB_REPOSITORY,,}/api:main"
          echo "        ghcr.io/${GITHUB_REPOSITORY,,}/strapi:main"
          echo "        ghcr.io/${GITHUB_REPOSITORY,,}/frontend:main"
          echo "        ghcr.io/${GITHUB_REPOSITORY,,}/admin-pannel:main"
