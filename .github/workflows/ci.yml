name: CI

on:
  push:
    branches: [main, dev, dev-*]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read
  packages: write

jobs:
  validate-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check compose file
        run: |
          cp .env.docker.example .env
          docker compose -f docker-compose.yml config

  test-api:
    name: API - Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

  lint-frontend:
    name: Frontend - Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Check module collisions (Linux-safe imports)
        run: npm run check:modules

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

  build-frontend:
    name: Frontend - Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

  build-admin-panel:
    name: Admin Panel - Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-pannel

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: admin-pannel/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

  build-images:
    name: Build & Push Docker Images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [validate-compose, test-api, lint-frontend, build-frontend, build-admin-panel]

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: ./api
            target: production
          - service: strapi
            context: ./strapi
            target: production
          - service: frontend
            context: ./frontend
            target: production
            build_args: |
              VITE_API_URL=https://api.elewen.co.in
              VITE_STRAPI_URL=https://strapi.elewen.co.in
              VITE_USE_FALLBACK=false
          - service: admin-pannel
            context: ./admin-pannel
            target: production
            build_args: |
              VITE_API_URL=https://api.elewen.co.in
              VITE_ADMIN_NO_AUTH=false

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build_args }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
